<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sử dụng thẻ hình ảnh</title>
</head>
<body>
    <h1>Hình ảnh yêu thích của tôi</h1>
    
    <!-- Sử dụng thẻ img với thuộc tính src (đường dẫn ảnh) và alt (mô tả ảnh) -->
    <img 
        src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=800&q=80" 
        alt="Không gian làm việc của lập trình viên với máy tính xách tay" 
        width="600"
    >
    
    <p>Thuộc tính <strong>alt</strong> giúp hiển thị văn bản thay thế nếu ảnh bị lỗi không tải được, đồng thời hỗ trợ tốt cho SEO và các trình đọc màn hình.</p>
</body>
</html>
